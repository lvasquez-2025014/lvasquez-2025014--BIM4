<div class="bg-grid"></div>
<div class="bg-spot"></div>
<div class="bg-grain"></div>

<main class="card" (mousemove)="onMouseMove($event)">
    <div class="logo in d1">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M9 10l7 12 7-12" stroke="#0a0a0a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
    </div>
    <h1 class="in d1">Iniciar sesión</h1>
    <p class="sub in d2">Accede a tu cuenta para continuar</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" [class.shake]="shake" novalidate>
        <div
            class="field in d2"
            [class.invalid]="form.controls.usuario.touched && form.controls.usuario.invalid"
        >
            <label for="user">Usuario</label>
            <div class="control">
                <svg class="lead" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input id="user" type="text" formControlName="usuario" placeholder="Tu usuario" autocomplete="username" />
            </div>
            <p class="hint">Ingresa tu usuario.</p>
        </div>

        <div
            class="field in d3"
            [class.invalid]="form.controls.password.touched && form.controls.password.invalid"
        >
            <label for="pass">Contraseña</label>
            <div class="control">
                <svg class="lead" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input
                    id="pass"
                    [type]="mostrarPassword ? 'text' : 'password'"
                    formControlName="password"
                    placeholder="••••••••"
                    autocomplete="current-password"
                />
                <button
                    class="eye"
                    type="button"
                    (click)="togglePassword()"
                    [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                >
                    @if (mostrarPassword) {
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.6 10.6 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.9 9.9 0 0 1 12 5c6.5 0 10 7 10 7a18.5 18.5 0 0 1-2.16 3.19"/><path d="m1 1 22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                    } @else {
                        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    }
                </button>
            </div>
            <p class="hint">Ingresa tu contraseña.</p>
        </div>

        @if (mensajeError) {
            <p class="api-error in d4">{{ mensajeError }}</p>
        }

        <button class="btn in d4" type="submit" [disabled]="cargando || exito" [class.loading]="cargando" [class.success]="exito">
            <span class="spinner" aria-hidden="true"></span>
            <span class="label">
                @if (cargando) {
                    Verificando…
                } @else if (exito) {
                    ✓ Bienvenido
                } @else {
                    Iniciar sesión
                }
            </span>
            <svg class="arrow" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
    </form>
</main>
