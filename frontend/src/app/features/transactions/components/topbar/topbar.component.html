<header class="topbar" role="banner">
  <button class="menu-button" type="button" aria-label="Abrir menú de navegación" (click)="menuToggle.emit()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>

  <div class="topbar-left">
    <div class="workspace-title">Control de gastos</div>
    <div class="workspace-status">
      <span class="workspace-status-dot" aria-hidden="true"></span>
      Sistema activo
    </div>
  </div>

  <div class="topbar-actions">
    <label class="search" for="global-search">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="6.5"></circle>
        <path d="m16 16 4 4"></path>
      </svg>
      <input id="global-search" type="search" placeholder="Buscar gasto, categoría o movimiento..."
        [value]="searchQuery()" (input)="onSearch($event)" aria-label="Búsqueda global" />
    </label>

    <button class="icon-button notification-button" type="button" title="Notificaciones"
      aria-label="Ver notificaciones (2 no leídas)" (click)="onNotificationsClick()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="notification-dot" aria-hidden="true"></span>
    </button>

    <div class="profile-container">
      <button class="profile-mini" type="button" title="Perfil" aria-label="Ver opciones de perfil"
        (click)="onProfileClick()" [attr.aria-expanded]="showProfileMenu()" [attr.aria-haspopup]="true">
        @if (userPhoto()) {
        <img [src]="userPhoto()" [alt]="userName()" class="profile-mini-img" referrerpolicy="no-referrer"
          crossorigin="anonymous" (error)="userPhoto.set(null)" />
        } @else {
        <span>{{ userInitials() }}</span>
        }
      </button>

      @if (showProfileMenu()) {
      <div class="profile-dropdown" (click)="$event.stopPropagation()">
        <div class="profile-summary">
          <button class="profile-menu-avatar" type="button" [disabled]="!userPhoto()" (click)="openPhotoPreview($event)" [attr.aria-label]="userPhoto() ? 'Ampliar foto de perfil' : 'Sin foto de perfil'">
            @if (userPhoto()) {
            <img [src]="userPhoto()" [alt]="userName()" referrerpolicy="no-referrer" crossorigin="anonymous"
              (error)="userPhoto.set(null)" />
            } @else {
            {{ userInitials() }}
            }
          </button>
          <div class="profile-identity">
            <strong>{{ userName() || 'Administrador' }}</strong>
            <span>Administrador</span>
          </div>
        </div>
        <div class="holographic-line"></div>
        <button class="btn-logout" type="button" (click)="onLogout($event)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Cerrar Sesión
        </button>
      </div>
      }
    </div>
  </div>
</header>

@if (showPhotoPreview() && userPhoto()) {
  <div class="photo-preview-backdrop" (click)="closePhotoPreview()" role="presentation">
    <section class="photo-preview" role="dialog" aria-modal="true" aria-label="Foto de perfil ampliada" (click)="$event.stopPropagation()">
      <div class="photo-preview-orb photo-preview-orb-one" aria-hidden="true"></div>
      <div class="photo-preview-orb photo-preview-orb-two" aria-hidden="true"></div>
      <header class="photo-preview-header">
        <div class="photo-preview-brand"><div><strong>Vought International</strong><small>Perfil de usuario</small></div></div>
      </header>
      <button class="photo-preview-close" type="button" (click)="closePhotoPreview()" aria-label="Cerrar vista ampliada">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="photo-preview-stage">
        <img [src]="userPhoto()" [alt]="'Foto de perfil de ' + userName()" referrerpolicy="no-referrer" crossorigin="anonymous" (error)="closePhotoPreview()">
      </div>
      <footer class="photo-preview-footer">
        <div class="photo-preview-identity"><strong>{{ userName() }}</strong><span><i aria-hidden="true"></i>Cuenta activa</span></div>
        <span class="photo-preview-tag">Vought ID</span>
      </footer>
    </section>
  </div>
}
