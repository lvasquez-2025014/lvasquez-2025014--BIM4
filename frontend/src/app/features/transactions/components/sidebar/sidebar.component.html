<aside class="sidebar" [class.collapsed]="isCollapsed()" [class.open]="isMobileMenuOpen()">
  <button class="sidebar-close" type="button" aria-label="Cerrar menú" (click)="closeMobileMenu()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
  </button>
  <div class="brand">
    <div class="brand-mark">
      @if (!logoFailed()) {
        <img class="brand-logo" src="/assets/images/logo.png?v=2" alt="Logo" (error)="onLogoError()">
      } @else {
        <span class="brand-fallback" aria-hidden="true">CG</span>
      }
    </div>
    <div class="brand-text" [class.hidden]="isCollapsed()">
      <div class="brand-title">Vought International</div>
      <div class="brand-subtitle">Gestión de gastos</div>
    </div>
  </div>

  <section class="section">
    <div class="section-title" [class.hidden]="isCollapsed()">Espacio de trabajo</div>
    <nav class="nav" aria-label="Navegación principal">
      <button
        class="nav-item"
        [class.active]="activePage() === 'resumen'"
        (click)="navigate('resumen')"
        [attr.aria-current]="activePage() === 'resumen' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Resumen</span>
      </button>
      <button
        class="nav-item"
        [class.active]="activePage() === 'gastos'"
        (click)="navigate('gastos')"
        [attr.aria-current]="activePage() === 'gastos' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Gastos</span>
      </button>
      <button
        class="nav-item"
        [class.active]="activePage() === 'ingresos'"
        (click)="navigate('ingresos')"
        [attr.aria-current]="activePage() === 'ingresos' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 6 23 6 23 12"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Ingresos</span>
      </button>
      <button
        class="nav-item"
        [class.active]="activePage() === 'presupuestos'"
        (click)="navigate('presupuestos')"
        [attr.aria-current]="activePage() === 'presupuestos' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><line x1="12" y1="12" x2="22" y2="2"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Presupuestos</span>
      </button>
      <button
        class="nav-item"
        [class.active]="activePage() === 'categorias'"
        (click)="navigate('categorias')"
        [attr.aria-current]="activePage() === 'categorias' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Categorías</span>
      </button>
    </nav>
  </section>

  <section class="section">
    <div class="section-title" [class.hidden]="isCollapsed()">Análisis</div>
    <nav class="nav" aria-label="Análisis">
      <button
        class="nav-item"
        [class.active]="activePage() === 'movimientos'"
        (click)="navigate('movimientos')"
        [attr.aria-current]="activePage() === 'movimientos' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Movimientos</span>
      </button>
      <button
        class="nav-item"
        [class.active]="activePage() === 'reportes'"
        (click)="navigate('reportes')"
        [attr.aria-current]="activePage() === 'reportes' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Reportes</span>
      </button>
    </nav>
  </section>

  <section class="section">
    <div class="section-title" [class.hidden]="isCollapsed()">Sistema</div>
    <nav class="nav" aria-label="Sistema">
      <button
        class="nav-item"
        [class.active]="activePage() === 'configuracion'"
        (click)="navigate('configuracion')"
        [attr.aria-current]="activePage() === 'configuracion' ? 'page' : null"
      >
        <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
        <span class="nav-label" [class.hidden]="isCollapsed()">Configuración</span>
      </button>
    </nav>
  </section>
</aside>

@if (isMobileMenuOpen()) {
  <div class="mobile-overlay" (click)="closeMobileMenu()" aria-hidden="true"></div>
}
