<div class="toast-container" *ngIf="notification" aria-live="polite" aria-atomic="true">
  <div class="toast" [ngClass]="notification.type" role="status">
    <div class="toast-glow" aria-hidden="true"></div>
    <div class="toast-accent" aria-hidden="true"></div>
    <div class="toast-icon">
      <svg *ngIf="notification.type === 'success'" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </svg>
      <svg *ngIf="notification.type === 'warning'" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
      <svg *ngIf="notification.type === 'error'" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10" />
        <line x1="15" y1="9" x2="9" y2="15" />
        <line x1="9" y1="9" x2="15" y2="15" />
      </svg>
      <svg *ngIf="notification.type === 'info'" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9" />
        <line x1="12" y1="11" x2="12" y2="16" />
        <line x1="12" y1="8" x2="12.01" y2="8" />
      </svg>
    </div>
    <div class="toast-body">
      <span class="toast-title">{{ notificationTitle }}</span>
      <span class="toast-message">{{ notification.message }}</span>
    </div>
    <div class="toast-actions">
      <button *ngIf="notification.actionText" type="button" class="toast-action" (click)="onActionClick()">
        {{ notification.actionText }}
      </button>
      <button class="toast-close" type="button" (click)="close()" aria-label="Cerrar notificación">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>
    <div class="toast-progress" *ngIf="!notification.isPersistent">
      <div class="toast-progress-bar" [ngClass]="notification.type"></div>
    </div>
  </div>
</div>
