@if (authService.getToken() || authService.isSessionExpired()) {
  <div class="app-ambient" aria-hidden="true">
    <span class="ambient-orb ambient-orb-one"></span>
    <span class="ambient-orb ambient-orb-two"></span>
    <span class="ambient-orb ambient-orb-three"></span>
  </div>
}

<div class="app-container" [class.blurred]="authService.isSessionExpired()">
  <router-outlet />
</div>

<app-notification></app-notification>

@if (authService.getToken() || authService.isSessionExpired()) {
  <div class="custom-cursor" [class.visible]="cursorVisible"
    [style.transform]="'translate3d(' + cursorX + 'px, ' + cursorY + 'px, 0)'"
    aria-hidden="true"></div>
  <div class="custom-cursor-follower" [class.visible]="cursorVisible" [class.hovering]="cursorHovering"
    [style.transform]="'translate3d(' + cursorX + 'px, ' + cursorY + 'px, 0)'"
    aria-hidden="true"></div>
}

<!-- Lock Screen Overlay -->
<div class="lock-screen-overlay" *ngIf="authService.isSessionExpired()">
  <div class="lock-card">
    <div class="lock-icon">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
    </div>
    <h2>Sesión Expirada</h2>
    <p>Por seguridad, su sesión ha expirado tras varios minutos de inactividad. Por favor, regrese al login para iniciar una nueva sesión.</p>

    <div class="actions" style="margin-top: 24px;">
      <button type="button" class="btn-primary" (click)="logoutCompleto()" style="width: 100%;">
        Regresar al Login
      </button>
    </div>
  </div>
</div>
